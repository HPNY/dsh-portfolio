url: https://github.com/HPNY/dsh-portfolio
name: HPNY/dsh-portfolio
category: ui
description:
  en: 'A-share and OTC fund dashboard forked from SuCriss/dsh-leekbox (MIT): indices, market boards, a limit-up sentiment thermometer, dragon-tiger list, full-market search, a watchlist with in-place position editing and price alerts, sortable columns plus drag-and-drop custom ordering persisted server-side, a linked detail rail / drill-down stock page with K-line, money flow and F10, a four-mode screener (weighted signals, multi-strategy cross, 35 quantitative factors, event-driven), 7x24 news, AI stock analysis, hover previews, and an OTC fund tab with NAV, cost-line distance, unwind progress and disclosed top-10 holdings. Layout adapts to the panel width via container queries.'
  zh: '持仓看板：A 股与场外基金看板，fork 自 SuCriss/dsh-leekbox（MIT）——大盘指数、板块、涨停情绪温度计、龙虎榜、全市场搜索、可原地编辑持仓成本与份额并带价格预警的自选、表格按列排序与拖拽自定义顺序（顺序存服务端）、右栏联动与钻取子页的个股详情（K 线 / 资金流向 / F10）、四种模式选股（信号评分 / 多策略交叉 / 35 量化因子 / 事件驱动）、7×24 快讯、AI 个股分析、列表行悬停预览，以及带净值、估值、距成本线与解套进度、阶段涨幅和最新披露前十大重仓实时涨跌的场外基金页。面板宽度变化用容器查询自适应。'
